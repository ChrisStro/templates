services:
  arcane-edge-agent:
    image: ghcr.io/getarcaneapp/agent:latest
    container_name: arcane-edge-agent
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PUID=1000
      - PGID=1000
      - EDGE_AGENT=true
      - EDGE_TRANSPORT=poll
      - MANAGER_API_URL=https://$ARCANE_SERVER

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - data:/app/data
      - ${STACK_PATH:-stacks}:/app/data/projects
      - ${BACKUP_PATH:-backups}:/backups

volumes:
  data:
  stacks:
  backups: