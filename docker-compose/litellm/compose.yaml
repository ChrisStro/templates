x-default: &default
  restart: 'unless-stopped'
  logging:
    driver: 'json-file'
    options:
      max-size: '500m'
      max-file: '2'

services:
  litellm:
    <<: *default
    image: ghcr.io/berriai/litellm:${LITELLM_IMAGE_TAG:-v1.106.4}
    container_name: litellm
    networks:
      - backend
      - proxy_network
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Prisma connection string. Special characters in POSTGRES_PASSWORD must be URL-encoded.
      - DATABASE_URL=postgresql://litellm:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/litellm
      # Models and virtual keys are managed in the Admin UI and stored in Postgres.
      # File-based models instead: mount the config, add the command, set STORE_MODEL_IN_DB=False:
      #   volumes: [ "./litellm_config.yaml:/app/config.yaml:ro" ]
      #   command: [ "--config", "/app/config.yaml", "--port", "4000" ]
      - STORE_MODEL_IN_DB=True
      # Admin credential (also the Admin UI password) and the key that encrypts provider
      # credentials in the database. Both are mandatory and must never be changed afterwards.
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env}
      - LITELLM_SALT_KEY=${LITELLM_SALT_KEY:?set LITELLM_SALT_KEY in .env}
      # Use the model price map bundled with the pinned image instead of fetching it from GitHub on
      # every start: faster cold start, no egress needed. Pricing then only updates with the image.
      - LITELLM_LOCAL_MODEL_COST_MAP=${LITELLM_LOCAL_MODEL_COST_MAP:-True}
    healthcheck:
      # The image is a Chainguard Wolfi base without curl or wget, so probe with its own Python.
      # A curl/wget based test would leave the container permanently unhealthy.
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      # The proxy applies its database schema on first start, which takes a while.
      start_period: 120s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=$PROXY_NETWORK"
      - "traefik.http.routers.litellm.rule=Host(`$PUBLIC_HOSTNAME`)"
      - "traefik.http.routers.litellm.entrypoints=${TRAEFIK_ENTRYPOINTS:-websecure}"
      # The Admin UI login (cookies, optional UI SSO) requires the public https scheme.
      - "traefik.http.routers.litellm.tls=true"
      - "traefik.http.services.litellm.loadbalancer.server.port=4000"
      # - "traefik.http.routers.litellm.tls.certresolver=letsencrypt" # when using tlsChallenge certresolver

  db:
    <<: *default
    image: docker.io/library/postgres:16
    container_name: litellm-db
    networks:
      - backend
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - litellm_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d litellm -U litellm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  litellm_db:

networks:
  backend:
  proxy_network:
    name: $PROXY_NETWORK
    external: true
