x-default: &default
  restart: 'unless-stopped'
  logging:
    driver: 'json-file'
    options:
      max-size: '500m'
      max-file: '2'

services:
  zabbix-mcp:
    <<: *default
    image: zabbix/zabbix-mcp-server:trunk-alpine
    networks:
      - default
      - proxy_network
    environment:
      ZBX_FRONTEND_URL: ${ZBX_FRONTEND_URL:-http://zabbix-web:8080/api_jsonrpc.php}
      # Traefik connects from another container address, so allow all by default.
      ZBX_ALLOWEDIP: ${ZBX_ALLOWEDIP:-0.0.0.0/0}
      ZBX_LISTENIP: ${ZBX_LISTENIP:-0.0.0.0}
      ZBX_LISTENPORT: ${ZBX_LISTENPORT:-8443}
      ZBX_DEBUGLEVEL: ${ZBX_DEBUGLEVEL:-3}
      ZBX_TIMEOUT: ${ZBX_TIMEOUT:-10}
      ZBX_IGNOREURLCERTERRORS: ${ZBX_IGNOREURLCERTERRORS:-false}
      ZBX_MAX_RESPONSE_SIZE: ${ZBX_MAX_RESPONSE_SIZE:-64K}
      ZBX_TOOL_PREFIX: ${ZBX_TOOL_PREFIX:-}
    volumes:
      - ${CERTS_HOSTPATH:-zabbix_certs}:/var/lib/zabbix/enc:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=$PROXY_NETWORK"
      - "traefik.http.routers.zabbix-mcp.rule=Host(`${PUBLIC_HOSTNAME}`)"
      - "traefik.http.routers.zabbix-mcp.entrypoints=${TRAEFIK_ENTRYPOINTS:-websecure}"
      - "traefik.http.services.zabbix-mcp.loadbalancer.server.port=${ZBX_LISTENPORT:-8443}"

volumes:
  zabbix_certs:

networks:
  proxy_network:
    name: $PROXY_NETWORK
    external: true
